name: build-canary

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REFS_URL: https://github.com/${{ github.repository }}/releases/download/practice-canary/build-refs.zip
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download CI reference assemblies
        shell: pwsh
        run: |
          $refs = Join-Path $env:GITHUB_WORKSPACE 'ci-refs'
          New-Item -ItemType Directory -Force $refs | Out-Null
          $refsZip = Join-Path $env:RUNNER_TEMP 'build-refs.zip'
          Invoke-WebRequest -Uri $env:REFS_URL -OutFile $refsZip
          Expand-Archive $refsZip -DestinationPath $refs -Force
          Write-Host "refs ready at $refs"

      - name: Build all mods
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\build.ps1" -Profile "$env:GITHUB_WORKSPACE/ci-refs"
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Package and publish per-mod canary releases
        shell: pwsh
        run: |
          $mods = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'mods') -Directory |
                  Where-Object { Test-Path (Join-Path $_.FullName "$($_.Name).csproj") }
          if (-not $mods) { throw "no mods found" }

          foreach ($m in $mods) {
              $name = $m.Name
              $dll = Get-ChildItem (Join-Path $m.FullName 'bin') -Recurse -Filter "$name.dll" |
                     Where-Object { $_.FullName -match '\\bin\\' -and $_.FullName -notmatch '\\obj\\' } |
                     Select-Object -First 1
              if (-not $dll) { Write-Error "no built dll for $name"; continue }

              # BigWalk.Practice keeps its existing tag/assets so the shared
              # download URLs keep working; other mods get <slug>-canary.
              $slug = $name -replace '[^A-Za-z0-9]', '-'
              $tag = if ($name -eq 'BigWalk.Practice') { 'practice-canary' } else { "$slug-canary" }
              $isLatest = $name -eq 'BigWalk.Practice'

              $stage = Join-Path $env:RUNNER_TEMP "pkg-$name"
              Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force (Join-Path $stage 'BepInEx\plugins') | Out-Null
              Copy-Item $dll.FullName (Join-Path $stage 'BepInEx\plugins\') -Force
              $zip = Join-Path $env:GITHUB_WORKSPACE "$name-canary.zip"
              if (Test-Path $zip) { Remove-Item $zip -Force }
              Compress-Archive (Join-Path $stage 'BepInEx') -DestinationPath $zip

              $dllOut = Join-Path $env:GITHUB_WORKSPACE "$name.dll"
              if (Test-Path $dllOut) { Remove-Item $dllOut -Force }
              Copy-Item $dll.FullName $dllOut -Force

              gh release create $tag --latest=$isLatest --title "$name (canary)" `
                  --notes "Automated build from $($env:GITHUB_SHA.Substring(0,8))." `
                  --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
              gh release upload $tag --clobber $dllOut $zip --repo $env:GITHUB_REPOSITORY
              Write-Host "published $name -> $tag"
          }